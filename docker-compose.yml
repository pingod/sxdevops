      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique random value before starting Compose}
      CMDB_PASSWORD_ENCRYPTION_KEY: ${CMDB_PASSWORD_ENCRYPTION_KEY:?Set a persistent Fernet key; preserve the existing key on upgrades}
      DEBUG: "0"
      SXDEVOPS_WAIT_FOR_DB: "1"
      SXDEVOPS_MIGRATE: "0"
      SXDEVOPS_WAIT_FOR_SCHEMA: "1"
      SXDEVOPS_SEED_DATA: "0"
      SXDEVOPS_SEED_TEMPLATES: "0"
      SXDEVOPS_OBSERVABILITY_SCHEDULER: "0"
    volumes:
      - aiops_runtime:/app/backend/runtime
    command: ["python", "manage.py", "run_observability_scheduler", "--interval", "3600"]

  postgres:
    image: postgres:16-alpine
    container_name: sxdevops-postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: sxdevops
      POSTGRES_USER: sxdevops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.sh or start.cmd to generate POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sxdevops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  aiops_runtime:
  planning_projects:
