      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique random value before starting Compose}
      CMDB_PASSWORD_ENCRYPTION_KEY: ${CMDB_PASSWORD_ENCRYPTION_KEY:?Set a persistent Fernet key; preserve the existing key on upgrades}
      DEBUG: "0"
      SXDEVOPS_WAIT_FOR_DB: "1"
      SXDEVOPS_MIGRATE: "0"
      SXDEVOPS_WAIT_FOR_SCHEMA: "1"
      SXDEVOPS_SEED_DATA: "0"
      SXDEVOPS_SEED_TEMPLATES: "0"
      SXDEVOPS_OBSERVABILITY_SCHEDULER: "0"
    command: ["python", "manage.py", "run_inspection_scheduler", "--interval", "60", "--limit", "20"]

  aiops-chat-worker:
    image: sxdevops:latest
    container_name: sxdevops-aiops-chat-worker
    restart: unless-stopped
    depends_on:
      sxdevops:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sxdevops
      POSTGRES_USER: sxdevops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.sh or start.cmd to generate POSTGRES_PASSWORD}
      CACHE_BACKEND: redis
      CACHE_IGNORE_EXCEPTIONS: "0"
      SXDEVOPS_TRUSTED_PROXIES: ${SXDEVOPS_TRUSTED_PROXIES:-}
      # 容器部署默认允许任意 Host（自建环境常以局域网 IP/域名访问）；公网部署请显式收敛
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique random value before starting Compose}
      CMDB_PASSWORD_ENCRYPTION_KEY: ${CMDB_PASSWORD_ENCRYPTION_KEY:?Set a persistent Fernet key; preserve the existing key on upgrades}
      DEBUG: "0"
      SXDEVOPS_WAIT_FOR_DB: "1"
      SXDEVOPS_MIGRATE: "0"
      SXDEVOPS_WAIT_FOR_SCHEMA: "1"
      SXDEVOPS_SEED_DATA: "0"
      SXDEVOPS_SEED_TEMPLATES: "0"
      AIOPS_LANGGRAPH_CHECKPOINT_BACKEND: postgresql
    volumes:
      - aiops_runtime:/app/backend/runtime
    command: ["python", "manage.py", "run_aiops_chat_worker", "--interval", "2"]

  planning-engine:
    image: sxdevops:latest
    container_name: sxdevops-planning-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sxdevops
      POSTGRES_USER: sxdevops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start.sh or start.cmd to generate POSTGRES_PASSWORD}
      CACHE_BACKEND: redis
      CACHE_IGNORE_EXCEPTIONS: "0"
      SXDEVOPS_TRUSTED_PROXIES: ${SXDEVOPS_TRUSTED_PROXIES:-}
      # 容器部署默认允许任意 Host（自建环境常以局域网 IP/域名访问）；公网部署请显式收敛
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique random value before starting Compose}
      CMDB_PASSWORD_ENCRYPTION_KEY: ${CMDB_PASSWORD_ENCRYPTION_KEY:?Set a persistent Fernet key; preserve the existing key on upgrades}
      DEBUG: "0"
      SXDEVOPS_WAIT_FOR_DB: "1"
      SXDEVOPS_MIGRATE: "0"
      SXDEVOPS_WAIT_FOR_SCHEMA: "1"
      SXDEVOPS_SEED_DATA: "0"
      SXDEVOPS_SEED_TEMPLATES: "0"
      # 引擎绑定容器接口供平台反代访问；不发布端口到宿主机，
      # 对外唯一入口是 sxdevops 的 /api/planning/（RBAC + 审计）。
      PLANNING_BIND: 0.0.0.0
    volumes:
      - aiops_runtime:/app/backend/runtime
      - planning_projects:/app/planning/projects
    command: ["python", "manage.py", "planning_engine"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  network-poller:
    image: sxdevops:latest
    container_name: sxdevops-network-poller
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sxdevops
