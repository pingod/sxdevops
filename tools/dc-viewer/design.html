<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三维机房设计器</title>
</head>
<body>
<div id="app" class="dz">
  <header class="dz-top">
    <div class="dz-brand">
      <span class="dz-brand-dot" aria-hidden="true"></span>
      <strong>三维机房设计器</strong>
      <span id="dz-project" class="dz-project">未命名机房</span>
      <span id="dz-dirty" class="dz-dirty" hidden>未保存</span>
    </div>
    <div class="dz-top-actions">
      <button type="button" id="dz-new" class="dz-embed-hide">新建机房</button>
      <button type="button" id="dz-open" class="dz-embed-hide">打开 JSON</button>
      <input id="dz-file" type="file" accept=".json,application/json" hidden>
      <span class="dz-sep" aria-hidden="true"></span>
      <button type="button" id="dz-undo" title="Ctrl+Z">撤销</button>
      <button type="button" id="dz-redo" title="Ctrl+Y">重做</button>
      <span class="dz-sep" aria-hidden="true"></span>
      <button type="button" id="dz-fit" title="F">复位视角</button>
      <button type="button" id="dz-walls" title="墙体与吊顶透明度">围护：半透明</button>
      <button type="button" id="dz-export" class="dz-embed-hide">导出 JSON</button>
      <button type="button" id="dz-save" class="dz-embed-hide is-primary">保存</button>
    </div>
  </header>

  <div class="dz-main">
    <aside class="dz-palette" aria-label="构件">
      <div class="dz-panel-title">构件库</div>
      <p class="dz-panel-hint">选中构件后在地面点击放置；墙体/桥架按住拖出走向。</p>
      <div id="dz-tools" class="dz-tools"></div>
      <div class="dz-panel-title dz-panel-title--sub">快速布局</div>
      <button type="button" id="dz-row" class="dz-wide-btn">机柜排…</button>
      <div class="dz-legend">
        <span><i class="dz-key">左键</i>选择 / 拖动 / 放置</span>
        <span><i class="dz-key">右键拖</i>旋转视角</span>
        <span><i class="dz-key">滚轮</i>缩放</span>
        <span><i class="dz-key">中键拖</i>平移</span>
        <span><i class="dz-key">R</i>旋转 90°</span>
        <span><i class="dz-key">Del</i>删除</span>
        <span><i class="dz-key">Ctrl+D</i>复制</span>
        <span><i class="dz-key">Esc</i>取消选择</span>
        <span><i class="dz-key">Alt</i>临时取消吸附</span>
      </div>
    </aside>

    <main class="dz-viewport">
      <canvas id="dz-canvas" role="img" aria-label="三维机房编辑视图"></canvas>
      <div id="dz-ghost-hint" class="dz-viewport-hint" hidden></div>
      <div id="dz-empty" class="dz-empty" hidden>
        <strong>空机房</strong>
        <p>先「新建机房」生成四面墙，或直接从构件库放置机柜。</p>
      </div>
      <div id="dz-busy" class="dz-busy" hidden><span class="dz-spinner"></span><span id="dz-busy-text">加载中…</span></div>
    </main>

    <aside class="dz-inspector" aria-label="属性">
      <div class="dz-panel-title">属性</div>
      <div id="dz-inspector-empty" class="dz-inspector-empty">未选中对象</div>
      <form id="dz-inspector-form" class="dz-form" hidden></form>
      <div class="dz-panel-title dz-panel-title--sub">机房设置</div>
      <div class="dz-form">
        <label class="dz-field"><span>名称</span><input id="dz-name" type="text" maxlength="120"></label>
        <label class="dz-field"><span>层高 mm</span><input id="dz-room-height" type="number" min="2000" max="12000" step="100"></label>
        <label class="dz-field"><span>架空地板 mm</span><input id="dz-floor-height" type="number" min="0" max="1500" step="50"></label>
      </div>
    </aside>
  </div>

  <footer class="dz-status">
    <span id="dz-stats">0 个对象</span>
    <span id="dz-cursor">x — / y —</span>
    <span id="dz-hint">左键选择与拖动，右键旋转视角</span>
  </footer>

  <div id="dz-dialog" class="dz-modal" hidden>
    <div class="dz-modal-box" role="dialog" aria-modal="true" aria-labelledby="dz-dialog-title">
      <h2 id="dz-dialog-title">新建机房</h2>
      <div id="dz-dialog-body" class="dz-dialog-body"></div>
      <div class="dz-modal-actions">
        <button type="button" id="dz-dialog-cancel">取消</button>
        <button type="button" id="dz-dialog-ok" class="is-primary">确定</button>
      </div>
    </div>
  </div>

  <div id="dz-toast" class="dz-toast" hidden></div>
</div>
<script type="module" src="/src/design/main.js"></script>
</body>
</html>
