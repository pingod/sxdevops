name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sxdevops
          POSTGRES_USER: sxdevops
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sxdevops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: sxdevops
      POSTGRES_USER: sxdevops
      POSTGRES_PASSWORD: ci-postgres-password
      CACHE_BACKEND: local
      DEBUG: '1'
      SECRET_KEY: ci-test-secret
      # 固定的合法 Fernet 密钥（仅用于 CI，不含任何真实凭据）。
      CMDB_PASSWORD_ENCRYPTION_KEY: 4r6mZ2cC0i5H0m2mY7pC0r8kQd2bJz1mZk8nT0vXyU4=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.lock.txt
      - name: Django checks
        working-directory: backend
        run: python manage.py check
      - name: Tests
        working-directory: backend
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
